spring:
  application.name: fgv-study-hub
  datasource:
    url: jdbc:h2:file:./data/studyhub;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.jdbc.time_zone: UTC
  flyway.locations: classpath:db/migration/common
  servlet.multipart:
    max-file-size: 25MB
    max-request-size: 100MB
server:
  port: ${SERVER_PORT:8080}
  error.include-message: never
app:
  cors.allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage.path: ${STORAGE_PATH:./data/uploads}
  ai:
    provider: ${AI_PROVIDER:ollama}
    api-key: ${OPENAI_API_KEY:}
    model: ${AI_MODEL:${OPENAI_MODEL:qwen3:4b-instruct}}
    notice-model: ${AI_NOTICE_MODEL:qwen3:1.7b}
    url: ${AI_URL:${OPENAI_URL:http://localhost:11434}}
    embedding-model: ${AI_EMBEDDING_MODEL:${OPENAI_EMBEDDING_MODEL:embeddinggemma}}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:${OPENAI_TIMEOUT_SECONDS:1800}}
  vector:
    top-k: 10
    provider: local
